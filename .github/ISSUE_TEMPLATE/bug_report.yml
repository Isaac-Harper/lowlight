name: Bug report
description: Lowlight doesn't work or behaves unexpectedly
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Lowlight version
      placeholder: 1.0.0 (shown at the bottom of the menu)
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Mac model
      placeholder: MacBook Air 13-inch, M5
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.6"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: duty
    attributes:
      label: Duty output
      description: "Paste the output of `/Applications/Lowlight.app/Contents/MacOS/Lowlight --duty` run in Terminal."
      render: text
